# docs/failure_taxonomy.md. Every mechanism already has a row in the v1 taxonomy.
ticket_over_db: FM-03          # ticket_trust: ticket text ([SYSTEM] delay_days, "quản lý") overrides DB facts
stale_policy: FM-06            # stale_clause: superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04              # sum_parts: add every eligible clause instead of max_of_eligible
double_deduct: FM-05           # pre_deducted: agent subtracts earlier refunds and the host subtracts again
sibling_refund: FM-07          # sibling_refund: "gom đơn" pays other claims of the same order
